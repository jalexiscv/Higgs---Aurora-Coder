name: aurora-tabs
repo: https://github.com/ai-ag2026/hermes-tabs
sha: 05d4a3c5c224cc1dbe575928f8ca2d04aa3abf55
subdir: aurora-plugin
title: "Aurora in the Browser"
description: "Settings page (in the language set in Aurora, nine languages; incl. which browser Aurora works in and its safety level; loosening must be confirmed in the browser) and guard rails for aurora-tabs, which lets Aurora work in individual tabs of your real, signed-in Chromium browser through an extension and an MCP relay. Disclosure — talks only to the aurora-tabs relay you configure (AURORA_TABS_RELAY, default 127.0.0.1:8766) with AURORA_TABS_ADMIN_TOKEN (paths /admin/settings and /admin/select, the latter picks the browser when several are connected); caches the last seen settings in plugin-data/aurora-tabs/settings.json and its own opt-in switch in plugin-data/aurora-tabs/options.json; the pre_tool_call hook rejects the tabs tools while switched off and, only if the user turns that switch on, blocked sites in Aurora's own browser tools and web_extract. No shell, no background processes, no telemetry."
maintainer: ai-ag2026
tier: community
category: tools
requires_aurora: ">=0.22.5"
docs_url: https://github.com/ai-ag2026/hermes-tabs#readme
version: "0.4.1"
platforms: []
known_issues:
  - Needs the aurora-tabs relay and browser extension from the same repository, and the relay registered as the MCP server named tabs. The plugin alone does nothing.
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - AURORA_TABS_ADMIN_TOKEN
