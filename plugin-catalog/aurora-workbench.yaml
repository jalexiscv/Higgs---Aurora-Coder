description: The Aurora desktop app in your browser. `aurora workbench` serves the desktop interface through the Aurora dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `aurora workbench` run and again after each Aurora update it runs `npm install --ignore-scripts` (guided by Aurora's lockfile) and Vite against your Aurora checkout's desktop sources, writing only under ~/.aurora/aurora-workbench and its own plugin dir (the checkout is only read), and starts `aurora dashboard` on loopback when none is running.
