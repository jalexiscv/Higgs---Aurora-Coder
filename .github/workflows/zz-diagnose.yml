name: Diagnose CI-only failures (temporary)

on:
  push:
    branches: ['claude/exciting-pasteur-j528t5']

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux slice 1 of 8
            runner: ubuntu-24.04
          - name: macos schema drift
            runner: macos-latest
          - name: windows git layout
            runner: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          packages: ${{ runner.os == 'Windows' && 'git,ripgrep,pnpm' || 'ripgrep,pnpm' }}
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Linux, the whole slice the journey test fails in
        if: runner.os == 'Linux'
        run: scripts/run_tests.sh --files "tests/gateway/test_journey_compress_restart_fifo.py" -- -m "not integration and not live" -vv --tb=short
        env:
          AURORA_TEST_FORKSERVER: "1"
          AURORA_TEST_FILE_RETRIES: '0'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

      - name: macOS, the schema drift file
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/run_tests.sh --files "tests/aurora_cli/test_browse_schema_drift.py" -- -m "platforms and not integration" -vv --tb=long
        env:
          AURORA_TEST_FILE_RETRIES: '0'

      - name: Windows, the git layout files
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/run_tests.sh --files "tests/aurora_cli/test_git_trampoline_windows_live.py;tests/tools/test_local_env_windows_msys.py;tests/aurora_cli/test_cmd_update.py" -- -m "platforms and not integration" -vv --tb=long
        env:
          AURORA_TEST_FILE_RETRIES: '0'
