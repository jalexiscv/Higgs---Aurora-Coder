name: Diagnose CI-only failures (temporary)

on:
  push:
    branches: ['claude/exciting-pasteur-j528t5']

permissions:
  contents: read

jobs:
  diagnose:
    name: macos schema drift under load
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          packages: ripgrep,pnpm
          extras: '["all", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run the slow browse test repeatedly, idle then loaded
        shell: bash
        run: |
          set -uo pipefail
          run_once() {
            "$AURORA_PYTHON" -m pytest tests/aurora_cli/test_browse_schema_drift.py -k slow_browse -m "platforms and not integration" -q -s -p no:cacheprovider 2>&1 \
              | grep -E "DIAG|RESULT|passed|failed|OwnershipConflict|^E  " | cut -c1-3000
          }
          echo "=== idle"; run_once; run_once
          for i in 1 2 3 4; do (while :; do :; done) & done
          (while :; do dd if=/dev/zero of="$RUNNER_TEMP/hog.bin" bs=1m count=64 2>/dev/null; sync; done) &
          sleep 2
          echo "=== loaded"; for i in 1 2 3 4 5; do run_once; done
          kill $(jobs -p) 2>/dev/null || true
        env:
          TZ: UTC
          PYTHONHASHSEED: '0'
